name: ned-me-ci
on:
  push: { paths: ['ned-me/**'] }
  pull_request: { paths: ['ned-me/**'] }
jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: DB migrations + RLS tests (avec PostGIS)
        run: WITH_POSTGIS=1 PSQL_ADMIN="psql -h localhost -U postgres" ned-me/db/tests/run.sh
      - name: Sauvegarde / restauration (intégrité, RLS, cloisonnement)
        env: { PGHOST: localhost, PGUSER: postgres }
        run: WITH_POSTGIS=1 PSQL_ADMIN="psql -h localhost -U postgres" ned-me/db/tests/backup_restore.sh
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ned-me/api/package-lock.json }
      - name: Serveur S3 réel (SeaweedFS) pour les tests d'intégration du stockage
        run: |
          printf '{"identities":[{"name":"ned","credentials":[{"accessKey":"nedtestkey","secretKey":"nedtestsecret123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/etc/s3.json:ro chrislusf/seaweedfs:4.48 server -dir=/data -ip.bind=0.0.0.0 -volume.max=5 -filer -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333/ && break; sleep 1; done
      - run: npm ci && npm run typecheck && npm test
        working-directory: ned-me/api
        env: { S3_TEST_ENDPOINT: http://127.0.0.1:8333 }
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pile Docker Compose réelle (db + api + stockage S3) et test de fumée de bout en bout
        working-directory: ned-me/deploy
        run: |
          cp .env.example .env
          sed -i 's/^DEV_JWT_SECRET=.*/DEV_JWT_SECRET=ci-only-secret-0123456789-abcdefghij/' .env
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.ci.yml up -d --build db storage api web
          ./smoke.sh
      - name: Journaux et arrêt
        if: always()
        working-directory: ned-me/deploy
        run: |
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.ci.yml logs --no-color db api storage web | tail -150
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.ci.yml down -v
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ned-me/api/package-lock.json
            ned-me/web/package-lock.json
      - run: npm ci
        working-directory: ned-me/api
      - name: Typecheck, tests unitaires (i18n, pluriels, couverture des clés), build
        run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: ned-me/web
      - run: npx playwright install --with-deps chromium
        working-directory: ned-me/web
      - name: Bout en bout (base + vraie API + vrai serveur Next + Chromium)
        run: PSQL_ADMIN="psql -h localhost -U postgres" ./e2e/run.sh
        working-directory: ned-me/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures-interface, path: ned-me/web/e2e/screenshots, if-no-files-found: ignore }
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp ned-me/deploy/.env.example ned-me/deploy/.env && docker compose -f ned-me/deploy/docker-compose.yml --env-file ned-me/deploy/.env config -q
