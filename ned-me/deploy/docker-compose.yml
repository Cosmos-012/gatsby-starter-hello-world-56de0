# Déploiement PMU standard : Docker Compose, sans Kubernetes. Non exécuté dans l'environnement de build (pas de démon Docker) — validé en CI via `docker compose config`.
name: ned-me
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ned
      POSTGRES_USER: ned_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ned_owner -d ned"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/ned
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ned_owner
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?requis}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?requis}
    volumes:
      - miniodata:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
volumes:
  pgdata:
  miniodata:
