# Déploiement PMU standard : Docker Compose, sans Kubernetes. Non exécuté dans l'environnement de build (pas de démon Docker) — validé en CI via `docker compose config`.
name: ned-me
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ned
      POSTGRES_USER: ned_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/migrations:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ned_owner -d ned"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  api:
    build: ../api
    environment:
      DATABASE_URL: postgres://ned_api:${API_DB_PASSWORD}@db:5432/ned
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-}          # développement/CI uniquement ; vide en production
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}   # ex. https://files.<domaine> (servi par Caddy, sans réécriture de chemin)
      S3_BUCKET: ${S3_BUCKET:-ned-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      TRUST_PROXY: "1"
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/ned
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ned_owner
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?requis}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?requis}
    volumes:
      - miniodata:/data
    restart: unless-stopped
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-ned-evidence}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?requis}
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
volumes:
  pgdata:
  miniodata:
