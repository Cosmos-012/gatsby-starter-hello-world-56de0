<!-- DocuCentral - edit layout for DCControlledDocument -->
<dom-module id="nuxeo-dccontrolleddocument-edit-layout">
  <template>
    <style include="docucentral-styles nuxeo-styles"></style>

    <nuxeo-input role="widget" value="{{document.properties.dc:title}}"
                 label="[[i18n('label.dublincore.title')]]" required
                 name="title"></nuxeo-input>

    <nuxeo-textarea role="widget" value="{{document.properties.dc:description}}"
                    label="[[i18n('label.dublincore.description')]]"></nuxeo-textarea>

    <div class="dc-section-title">[[i18n('label.docucentral.classification')]]</div>
    <div class="dc-grid">
      <nuxeo-directory-suggestion role="widget" directory-name="dc_department"
                                  value="{{document.properties.dcx:department}}"
                                  label="[[i18n('label.docucentral.department')]]"
                                  min-chars="0" required></nuxeo-directory-suggestion>

      <nuxeo-directory-suggestion role="widget" directory-name="dc_docclass"
                                  value="{{document.properties.dcx:documentClass}}"
                                  label="[[i18n('label.docucentral.documentClass')]]"
                                  min-chars="0" required></nuxeo-directory-suggestion>

      <nuxeo-directory-suggestion role="widget" directory-name="dc_confidentiality"
                                  value="{{document.properties.dcx:confidentiality}}"
                                  label="[[i18n('label.docucentral.confidentiality')]]"
                                  min-chars="0"></nuxeo-directory-suggestion>
    </div>

    <div class="dc-section-title">[[i18n('label.docucentral.accountability')]]</div>
    <div class="dc-grid">
      <nuxeo-user-suggestion role="widget" value="{{document.properties.dcx:owner}}"
                             label="[[i18n('label.docucentral.owner')]]"
                             search-type="USER_TYPE"></nuxeo-user-suggestion>

      <nuxeo-user-suggestion role="widget" value="{{document.properties.dcx:reviewers}}"
                             label="[[i18n('label.docucentral.reviewers')]]"
                             search-type="USER_TYPE" multiple></nuxeo-user-suggestion>

      <nuxeo-user-suggestion role="widget" value="{{document.properties.dcx:approver}}"
                             label="[[i18n('label.docucentral.approver')]]"
                             search-type="USER_TYPE"></nuxeo-user-suggestion>
    </div>

    <div class="dc-section-title">[[i18n('label.docucentral.governance')]]</div>
    <div class="dc-grid">
      <nuxeo-date-picker role="widget" value="{{document.properties.dcx:effectiveDate}}"
                         label="[[i18n('label.docucentral.effectiveDate')]]"></nuxeo-date-picker>

      <nuxeo-date-picker role="widget" value="{{document.properties.dcx:nextReviewDate}}"
                         label="[[i18n('label.docucentral.nextReviewDate')]]"></nuxeo-date-picker>

      <nuxeo-input role="widget" type="number" value="{{document.properties.dcx:retentionYears}}"
                   label="[[i18n('label.docucentral.retentionYears')]]"></nuxeo-input>
    </div>
  </template>

  <script>
    Polymer({
      is: 'nuxeo-dccontrolleddocument-edit-layout',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {
        document: { type: Object }
      }
    });
  </script>
</dom-module>
